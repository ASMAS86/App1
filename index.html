<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="التحري المناطقي">

<title>منظومة التحري المناطقي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1030;--navy2:#1a1f4d;--coral:#f4586a;--bg:#eef0f8;--card:#fff;--line:#dfe2f0;--text:#1b1f3b;--muted:#7b80a3;--tint:#eef0fa;color-scheme:light;background:var(--navy);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d24;--card:#151938;--line:#242a5a;--text:#e9ebfa;--muted:#8d93bd;--tint:#1d2250;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:"Cairo",-apple-system,Tahoma,sans-serif;font-size:13px}
body{background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer}
.hidden{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:relative;overflow:hidden;color:#fff;text-align:center;padding:22px 20px 50px;background:radial-gradient(120% 90% at 50% 0,#262d75 0,var(--navy) 65%)}
header:before,.tb:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/22px 22px;-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
header>*{position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:#b8bde6;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:3px 10px;margin-bottom:14px;background:rgba(255,255,255,.04)}
.chip i{width:6px;height:6px;border-radius:50%;background:#3ddc97;box-shadow:0 0 8px #3ddc97}
.logo{width:68px;height:68px;border-radius:50%;background:#fff;display:block;margin:0 auto 10px;object-fit:cover;box-shadow:0 0 0 2px var(--coral),0 0 0 6px rgba(244,88,106,.18),0 8px 24px rgba(0,0,0,.4)}
h1{margin:0;font-size:16px;font-weight:700}
.sub{margin-top:2px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9aa0d6}
.gl{width:44px;height:2px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--coral),transparent)}
main,.wrapf{margin-top:-26px;position:relative;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 14px 24px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat span{display:block;font-size:10.5px;color:var(--muted)}
.stat b{font-size:19px;font-weight:700}
.main-btn{width:100%;display:flex;align-items:center;gap:10px;border:0;background:linear-gradient(135deg,#f4586a,#e8445a);color:#fff;font-family:inherit;font-size:13.5px;font-weight:700;padding:12px 14px;border-radius:14px;box-shadow:0 6px 16px rgba(244,88,106,.3);margin-bottom:10px}
.main-btn .ic{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.main-btn .go{margin-inline-start:auto;opacity:.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-size:12.5px;font-weight:600;border-radius:14px;padding:10px;text-align:start}
.card .ic{width:30px;height:30px;border-radius:9px;background:var(--tint);color:var(--coral);display:flex;align-items:center;justify-content:center;flex:none}
.wide{grid-column:1/-1}
footer{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;font-size:10.5px;color:var(--muted)}
footer svg{width:13px;height:13px}
/* add page */
.tb{position:relative;overflow:hidden;background:radial-gradient(120% 120% at 50% 0,#262d75 0,var(--navy) 70%);color:#fff;display:flex;align-items:center;gap:12px;padding:16px 14px 38px}
.tb>*{position:relative}
.tb b{display:block;font-size:15px;font-weight:700}
.tb span{font-size:10.5px;color:#9aa0d6}
.back{width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;display:flex;align-items:center;justify-content:center}
.wrapf{margin-top:-24px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-size:11px;color:var(--muted);font-weight:600}
.fld input,.fld textarea{font-family:inherit;font-size:13.5px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:42px;outline:none;-webkit-appearance:none;appearance:none}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(244,88,106,.15)}
.acts{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.abtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-size:11.5px;font-weight:600;border-radius:14px;padding:11px 4px}
.abtn svg{color:var(--coral)}
.pv,.sv{grid-column:1/-1;flex-direction:row;gap:8px;border:0;color:#fff;padding:13px;font-size:13px}
.pv{background:var(--navy2)}
.sv{background:linear-gradient(135deg,#f4586a,#e8445a);font-size:13.5px;font-weight:700;box-shadow:0 6px 16px rgba(244,88,106,.3)}
.pv svg,.sv svg{color:#fff}
/* preview */
.prev{position:fixed;inset:0;z-index:50;background:#0a0c22;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pvbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;color:#fff;font-weight:700;font-size:13.5px}
.pvbody{flex:1;overflow:auto;padding:6px 12px;-webkit-overflow-scrolling:touch}
.pvbody canvas{display:block;width:100%;height:auto;background:#fff;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.pvbody.z canvas{width:230%}
.pvhint{text-align:center;font-size:10.5px;color:#8d93bd;padding:6px}
.pvacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.pvacts .abtn{background:#171a42;border-color:#2a2f66;color:#fff}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1a1f4d;color:#fff;padding:9px 16px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#toast.on{opacity:1}
#printArea{display:none}
@media print{@page{size:A4;margin:0}:root{padding:0!important;background:#fff!important}html,body{background:#fff!important}body>*:not(#printArea){display:none!important}#printArea{display:block}#printArea img{width:210mm;height:297mm;display:block}}
</style>
</head>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var FIELDS=[
['f1','رقم وتاريخ الكتاب','text',1],['f2','الاسم الرباعي واللقب','text',1],
['f3','التولد','text',0],['f4','اسم الأم','text',0],
['f5','اسم الزوج / ة','text',1],['f6','العنوان','area',1],
['f7','العمل','text',0],['f8','التحصيل الدراسي','text',0],
['f9','رقم الهاتف','tel',1],['f10','الموقف الأمني','area',1],
['f11','صحة الادعاء','text',0],['f12','الإحداثي','coord',0],
['f13','معلومات أخرى','area',1],['f14','الترميز السري','text',1],
['f15','تاريخ الاستلام','date',0],['f16','تاريخ الإجابة','date',0]
];

/* ---------- form ---------- */
var frm=$('frm');
FIELDS.forEach(function(f){
  var w=document.createElement('div');w.className='fld'+(f[3]?' full':'');
  var lb=document.createElement('label');lb.textContent=f[1];lb.htmlFor='i_'+f[0];
  var el;
  if(f[2]==='area'){el=document.createElement('textarea');el.rows=2;}
  else{el=document.createElement('input');el.type=f[2]==='date'?'date':(f[2]==='tel'?'tel':'text');if(f[2]==='tel')el.inputMode='tel';}
  el.id='i_'+f[0];
  if(f[2]==='coord'){el.dir='ltr';}else if(f[2]!=='date'){el.dir='auto';}
  el.autocomplete='off';
  w.appendChild(lb);w.appendChild(el);frm.appendChild(w);
});
function readForm(){var o={};FIELDS.forEach(function(f){o[f[0]]=$('i_'+f[0]).value.trim();});return o;}
function clearForm(){FIELDS.forEach(function(f){$('i_'+f[0]).value='';});}

/* ---------- toast & navigation ---------- */
var tt;function toast(m){var e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on');},2300);}
function show(v){var a=document.querySelectorAll('.view');for(var i=0;i<a.length;i++)a[i].classList.toggle('hidden',a[i].id!==v);window.scrollTo(0,0);}
$('bAdd').onclick=function(){history.pushState({v:'add'},'');show('add');};
$('bBack').onclick=function(){history.back();};
window.addEventListener('popstate',function(){
  if(!$('prev').classList.contains('hidden')){$('prev').classList.add('hidden');return;}
  show('home');
});
['bList','bSearch','bRep','bImp','bExp'].forEach(function(id){$(id).onclick=function(){toast('هذه الميزة نضيفها في الخطوة القادمة');};});

/* ---------- database (IndexedDB) ---------- */
function db(){return new Promise(function(res,rej){var q=indexedDB.open('regional_db',1);q.onupgradeneeded=function(){q.result.createObjectStore('records',{keyPath:'id',autoIncrement:true});};q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}
function dbAdd(rec){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction('records','readwrite');var r=t.objectStore('records').add(rec);t.oncomplete=function(){res(r.result);};t.onerror=function(){rej(t.error);};});});}
function dbAll(){return db().then(function(d){return new Promise(function(res,rej){var r=d.transaction('records').objectStore('records').getAll();r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});});}
function refreshStats(){return dbAll().then(function(a){var s=new Date();s.setHours(0,0,0,0);var n=0;a.forEach(function(r){if(r.createdAt>=s.getTime())n++;});$('sTotal').textContent=a.length;$('sToday').textContent=n;}).catch(function(){});}
function saveRec(){
  var rec=readForm();
  if(!FIELDS.some(function(f){return rec[f[0]];})){toast('اكتب بيانات قيد واحد على الأقل');return;}
  rec.createdAt=Date.now();rec.code=codeOf(rec);
  dbAdd(rec).then(function(id){clearForm();refreshStats();toast('تم حفظ القيد رقم '+id);window.scrollTo(0,0);}).catch(function(){toast('تعذّر حفظ القيد');});
}
$('bSave').onclick=saveRec;

/* ---------- verification code & seeded pattern ---------- */
function cyrb53(str,seed){seed=seed||0;var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function joined(rec){return FIELDS.map(function(f){return (rec[f[0]]||'').trim();}).join('\u0001');}
function codeOf(rec){var t=cyrb53(joined(rec)).toString(36).toUpperCase();t=('000000000'+t).slice(-8);return t.slice(0,4)+'-'+t.slice(4);}
function prng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- A4 sheet rendering (canvas, 200 dpi) ---------- */
var W=1654,H=2339,MM=W/210,NAVY='#0d1030',GOLD='#b8975a',INK='#1b1f3b';
var FF='"Cairo","Geeza Pro","Segoe UI",Tahoma,sans-serif';
function fnt(x,mm,w){x.font=(w||400)+' '+(mm*MM)+'px '+FF;}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

function rosette(x,cx,cy,rad,rnd,col,lw){
  var R=100,c=[21,23,27,29,31,33,37,39,41,43,47,49];
  var r=c[Math.floor(rnd()*c.length)],d=r*(0.55+rnd()*0.6),k=(R-r)/r;
  var s=rad/((R-r)+d),rot=rnd()*6.283,cr=Math.cos(rot),sr=Math.sin(rot),T=2*Math.PI*r;
  x.beginPath();
  for(var t=0,first=true;t<=T;t+=0.02){
    var px=(R-r)*Math.cos(t)+d*Math.cos(k*t),py=(R-r)*Math.sin(t)-d*Math.sin(k*t);
    var X=cx+s*(px*cr-py*sr),Y=cy+s*(px*sr+py*cr);
    if(first){x.moveTo(X,Y);first=false;}else x.lineTo(X,Y);
  }
  x.strokeStyle=col;x.lineWidth=lw;x.stroke();
}
function waves(x,y0,h,rnd,col,n){
  var f1=0.010+rnd()*0.012,f2=0.018+rnd()*0.02,p1=rnd()*6,p2=rnd()*6;
  x.strokeStyle=col;x.lineWidth=0.14*MM;
  for(var i=0;i<n;i++){
    var o=i/(n-1);x.beginPath();
    for(var px=7*MM;px<=W-7*MM;px+=5){
      var y=y0+h*(0.5+(o-0.5)*(0.2+0.8*Math.abs(Math.sin(px*f1+p1))))+0.12*h*Math.sin(px*f2+p2+o*3);
      if(px===7*MM)x.moveTo(px,y);else x.lineTo(px,y);
    }
    x.stroke();
  }
}
function microtext(x,y,txt,col){
  fnt(x,1.35,600);x.fillStyle=col;x.direction='rtl';x.textAlign='right';
  var w=x.measureText(txt).width||1,n=Math.ceil((182*MM)/w)+1,s='';for(var i=0;i<n;i++)s+=txt;
  x.save();x.beginPath();x.rect(14*MM,y-3*MM,182*MM,4*MM);x.clip();x.fillText(s,W-14*MM,y);x.restore();
}
function background(x,rnd,code){
  rosette(x,105*MM,160*MM,92*MM,rnd,'rgba(13,16,48,.13)',0.12*MM);
  rosette(x,105*MM,160*MM,70*MM,rnd,'rgba(184,151,90,.28)',0.12*MM);
  rosette(x,105*MM,160*MM,48*MM,rnd,'rgba(13,16,48,.10)',0.12*MM);
  rosette(x,105*MM,160*MM,30*MM,rnd,'rgba(184,151,90,.22)',0.12*MM);
  waves(x,7*MM,5.5*MM,rnd,'rgba(13,16,48,.55)',16);
  waves(x,7*MM,5.5*MM,rnd,'rgba(184,151,90,.65)',10);
  waves(x,285*MM,5.5*MM,rnd,'rgba(13,16,48,.55)',16);
  waves(x,285*MM,5.5*MM,rnd,'rgba(184,151,90,.65)',10);
  x.lineWidth=0.5*MM;x.strokeStyle='rgba(13,16,48,.7)';x.strokeRect(4*MM,4*MM,202*MM,289*MM);
  x.lineWidth=0.2*MM;x.strokeStyle=GOLD;x.strokeRect(5.3*MM,5.3*MM,199.4*MM,286.4*MM);
  microtext(x,14.6*MM,'جهاز الأمن الوطني العراقي • '+code+' • ','rgba(13,16,48,.55)');
  microtext(x,283.4*MM,'مشروع الأمن المناطقي • '+code+' • ','rgba(13,16,48,.55)');
}
function header(x,id){
  var rx=W-14*MM,d=20*MM,cx=rx-d/2,cy=27*MM,lg=$('logoImg');
  x.save();x.beginPath();x.arc(cx,cy,d/2,0,7);x.clip();x.fillStyle='#fff';x.fillRect(cx-d/2,cy-d/2,d,d);
  if(lg&&lg.complete&&lg.naturalWidth)x.drawImage(lg,cx-d/2,cy-d/2,d,d);x.restore();
  x.beginPath();x.arc(cx,cy,d/2+0.7*MM,0,7);x.strokeStyle=GOLD;x.lineWidth=0.5*MM;x.stroke();
  var tx=rx-d-5*MM;x.direction='rtl';x.textAlign='right';
  x.fillStyle=NAVY;fnt(x,5.4,700);x.fillText('جهاز الأمن الوطني العراقي',tx,cy-0.8*MM);
  x.fillStyle=GOLD;fnt(x,3.9,600);x.fillText('مشروع الأمن المناطقي',tx,cy+6.2*MM);
  x.textAlign='left';x.fillStyle='#6a7092';fnt(x,3,600);x.fillText('رقم القيد',14*MM,cy-3.5*MM);
  x.fillStyle=NAVY;fnt(x,6,700);x.fillText(id?('000000'+id).slice(-6):'— — —',14*MM,cy+4.5*MM);
  x.fillStyle=GOLD;x.fillRect(14*MM,41*MM,182*MM,0.7*MM);x.fillStyle=NAVY;x.fillRect(14*MM,42.4*MM,182*MM,0.2*MM);
}
function title(x){
  rr(x,14*MM,46*MM,182*MM,11*MM,2*MM);x.fillStyle='rgba(241,244,249,.88)';x.fill();x.strokeStyle='#cdd4e3';x.lineWidth=0.3*MM;x.stroke();
  x.fillStyle='#f4586a';x.fillRect(W-14*MM-1.6*MM,46*MM+2.2*MM,0.9*MM,6.6*MM);
  x.direction='rtl';x.textAlign='center';x.fillStyle=NAVY;fnt(x,5.8,700);x.fillText('استمارة التحري الميداني',W/2,46*MM+5.5*MM+0.35*5.8*MM);
}
function fmtDate(v){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);return m?(m[3]+'/'+m[2]+'/'+m[1]):v;}
function valOf(rec,f){var v=(rec[f[0]]||'').trim();return f[2]==='date'?fmtDate(v):v;}
function wrap(x,text,maxW,fs,maxLines){
  fnt(x,fs,400);x.direction='rtl';
  var out=[];
  String(text).split(/\n/).forEach(function(p){
    var words=p.split(/\s+/).filter(Boolean),cur='';
    if(!words.length){out.push('');return;}
    words.forEach(function(w){
      var t=cur?cur+' '+w:w;
      if(x.measureText(t).width<=maxW){cur=t;return;}
      if(cur)out.push(cur);cur='';
      while(x.measureText(w).width>maxW&&w.length>1){var k=w.length;while(k>1&&x.measureText(w.slice(0,k)).width>maxW)k--;out.push(w.slice(0,k));w=w.slice(k);}
      cur=w;
    });
    out.push(cur);
  });
  if(out.length>maxLines){out=out.slice(0,maxLines);out[maxLines-1]=out[maxLines-1].replace(/\s*\S{0,3}$/,'')+' …';}
  return out;
}
function table(x,rec){
  var L=14*MM,Rr=W-14*MM,lw=46*MM,vw=Rr-L-lw,top=63*MM,avail=213*MM,best=null,fs,bh;
  function plan(fs,bh){
    var rows=FIELDS.map(function(f){var v=valOf(rec,f)||'-';var lines=wrap(x,v,vw-6*MM,fs,8);var lh=fs*1.5;return{lines:lines,lh:lh,h:Math.max(bh*MM,lines.length*lh*MM+4*MM)};});
    return{rows:rows,fs:fs,tot:rows.reduce(function(a,r){return a+r.h;},0)};
  }
  for(fs=4.4;fs>=2.8&&!best;fs-=0.2){for(bh=13.4;bh>=8;bh-=0.4){var p=plan(fs,bh);if(p.tot<=avail){best=p;break;}}}
  if(!best)best=plan(2.8,8);
  var y=top;x.lineWidth=0.25*MM;x.strokeStyle='#c9d1e2';
  best.rows.forEach(function(r,i){
    var f=FIELDS[i],empty=!valOf(rec,f);
    x.fillStyle='rgba(244,247,251,.84)';x.fillRect(Rr-lw,y,lw,r.h);
    x.strokeRect(Rr-lw,y,lw,r.h);x.strokeRect(L,y,vw,r.h);
    var lf=best.fs;fnt(x,lf,700);x.direction='rtl';while(x.measureText(f[1]).width>lw-6*MM&&lf>2){lf-=0.2;fnt(x,lf,700);}
    x.textAlign='right';x.fillStyle=NAVY;x.fillText(f[1],Rr-3*MM,y+r.h/2+lf*0.34*MM);
    fnt(x,best.fs,400);x.fillStyle=empty?'#8a90ab':INK;
    var th=r.lines.length*r.lh*MM,ty=y+(r.h-th)/2+r.lh*MM*0.74;
    x.direction=(f[2]==='coord')?'ltr':'rtl';
    r.lines.forEach(function(t){x.fillText(t,Rr-lw-3*MM,ty);ty+=r.lh*MM;});
    x.direction='rtl';
    y+=r.h;
  });
}
function stamp(){var d=new Date(),p=function(n){return('0'+n).slice(-2);};return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+'  '+p(d.getHours())+':'+p(d.getMinutes());}
function footer(x,code){
  x.direction='rtl';fnt(x,3,600);x.fillStyle='#565c80';
  x.textAlign='right';x.fillText('رمز التحقق: '+code,W-14*MM,279.6*MM);
  x.textAlign='left';x.fillText('تاريخ الإصدار: '+stamp(),14*MM,279.6*MM);
}
function sheet(rec,id){
  var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  var code=codeOf(rec),rnd=prng(cyrb53(joined(rec),7)%4294967296);
  background(x,rnd,code);header(x,id);title(x);table(x,rec);footer(x,code);
  return c;
}
function sheetNow(){return sheet(readForm(),null);}

/* ---------- JPEG / PDF / print ---------- */
function jpgBytes(c){var u=c.toDataURL('image/jpeg',0.92),b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function pdfBlob(jpg,w,h){
  var enc=new TextEncoder(),parts=[],off=0,offs=[];
  function push(d){var u=typeof d==='string'?enc.encode(d):d;parts.push(u);off+=u.length;}
  function obj(n,body){offs[n]=off;push(n+' 0 obj\n'+body+'\nendobj\n');}
  push('%PDF-1.4\n');push(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
  var cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  obj(4,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  offs[5]=off;push('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');push(jpg);push('\nendstream\nendobj\n');
  var xr=off,t='xref\n0 6\n0000000000 65535 f \n';
  for(var i=1;i<=5;i++)t+=('0000000000'+offs[i]).slice(-10)+' 00000 n \n';
  t+='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';push(t);
  return new Blob(parts,{type:'application/pdf'});
}
function fname(ext){var d=new Date(),p=function(n){return('0'+n).slice(-2);};return 'form-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.'+ext;}
function deliver(blob,name){
  var f;try{f=new File([blob],name,{type:blob.type});}catch(e){f=null;}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
    return navigator.share({files:[f]}).catch(function(e){if(e&&e.name==='AbortError')return;dl(blob,name);});
  }
  dl(blob,name);
}
function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);}
function needData(){var r=readForm();if(!FIELDS.some(function(f){return r[f[0]];})){toast('اكتب بعض البيانات أولًا');return false;}return true;}
function doJpg(){if(!needData())return;var c=sheetNow();deliver(new Blob([jpgBytes(c)],{type:'image/jpeg'}),fname('jpg'));}
function doPdf(){if(!needData())return;var c=sheetNow();deliver(pdfBlob(jpgBytes(c),c.width,c.height),fname('pdf'));}
function doPrint(){
  if(!needData())return;var c=sheetNow(),img=new Image();
  var go=function(){window.print();};
  img.src=c.toDataURL('image/jpeg',0.95);$('printArea').innerHTML='';$('printArea').appendChild(img);
  if(img.decode)img.decode().then(go,go);else img.onload=go;
}
['bJpg','pJpg'].forEach(function(i){$(i).onclick=doJpg;});
['bPdf','pPdf'].forEach(function(i){$(i).onclick=doPdf;});
['bPrn','pPrn'].forEach(function(i){$(i).onclick=doPrint;});

/* ---------- preview ---------- */
var fontsReady=Promise.resolve();
try{fontsReady=Promise.all([document.fonts.load('400 20px Cairo'),document.fonts.load('700 20px Cairo'),document.fonts.load('600 20px Cairo')]).catch(function(){});}catch(e){}
$('bPrev').onclick=function(){
  if(!needData())return;
  fontsReady.then(function(){
    var c=sheetNow(),b=$('pvBody');b.classList.remove('z');b.innerHTML='';b.appendChild(c);
    c.onclick=function(){b.classList.toggle('z');};
    history.pushState({v:'prev'},'');$('prev').classList.remove('hidden');b.scrollTop=0;
  });
};
$('pvClose').onclick=function(){history.back();};

/* ---------- start ---------- */
refreshStats();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
window.__t={sheet:sheet,pdfBlob:pdfBlob,FIELDS:FIELDS,codeOf:codeOf};
})();
</script>
